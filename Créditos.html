<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>La biblioteca de mi novia - Créditos</title>
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    </head>
    <style>
        /* --- 1. BASE Y FONDO --- */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif; /* Cambiado para coincidir con canciones/créditos */
            color: #1e293b;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #a7ffeb 0%, #e0f7fa 100%);
            z-index: -1;
        }

        /* --- 2. CABECERA Y TEXTOS --- */
        h1 {
            text-align: center;
            font-family: 'Dancing Script', cursive; /* Tipografía elegante para el título */
            font-size: clamp(28px, 5vw, 42px);
            margin: 40px 0;
            color: #1a237e;
            font-weight: 800;
        }

        .contenedor_0 {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 40px;
            padding: 0 20px;
            font-size: 18px;
            color: #1e293b !important; 
            line-height: 1.6;
            font-weight: bold;
            font-family: 'Poppins', sans-serif; /* Asegura consistencia en el texto de bienvenida */
        }

        .centrada {
            display: block;
            margin: auto;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 6px solid white;
            margin-bottom: 30px;
            max-width: 90%;
            transition: transform 0.3s ease;
        }

        .centrada:hover {
            transform: scale(1.02);
        }

        /* --- 3. MENÚ SUPERIOR --- */
        .menu-superior {
            background: rgba(26, 35, 126, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 50px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .menu-superior .logo {
            font-family: 'Dancing Script', cursive; /* Tipografía para el logo del menú */
            font-size: 24px;
            font-weight: bold;
        }

        .menu-superior ul {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .menu-superior a {
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: opacity 0.3s;
        }

        .menu-superior a:hover {
            opacity: 0.8;
        }

        /* --- 4. AJUSTE MÓVIL --- */
        @media (max-width: 700px) {
            .menu-superior {
                padding: 15px;
                flex-direction: column;
                gap: 10px;
            }
            h1 { font-size: 35px; }
            .contenedor_0 { font-size: 17px; width: 85%; }
        }
    </style>
   
    <body>
        <nav class="menu-superior">
            <div class="logo">Biblioteca de Mi Novia</div>
            <ul>
                <li><a href="index.html">Página Principal</a></li>
                <li><a href="Biblioteca_Tati_Pelis.html">Canciones</a></li>
                <li><a href="Créditos.html">Créditos</a></li>
            </ul>
        </nav>

        <h1>CRÉDITOS</h1>

        <p><img src="archivos y fotos/harry styles.jpg" alt="Harry Styles" class="centrada"></p>

        <div class="contenedor_0">
            <p>Adrián (Lógicamente)</p>
            <p style="font-size: 16px; opacity: 0.8; font-weight: normal; margin-top: 15px;">
                & ChatGPT (tan solo dudas sobre cómo se hacían ciertas cosas, ¡aprendí a hacerlo todo con este proyecto!)
            </p>
        </div>

        <script>
            // Verificación de acceso
            if (sessionStorage.getItem('accesoPermitido') !== 'true') {
                window.location.href = "index.html"; 
            }
        </script>
    </body>
</html>
